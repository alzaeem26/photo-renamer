<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0f172a">
  <meta name="application-name" content="كاميرا الزعيم للتصوير">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="كاميرا الزعيم">
  <link rel="manifest" href="manifest.json">
  <title>كاميرا الزعيم للتصوير</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* الشريط العلوي */
    header {
      padding: 8px 10px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #334155;
      z-index: 10;
    }
    .app-title {
      font-weight: bold;
      font-size: 13px;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .btn-header {
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 5px 7px;
      border-radius: 7px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }
    .btn-active-green {
      background: #065f46;
      border-color: #10b981;
      color: #ecfdf5;
    }
    .btn-zip {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
      font-weight: bold;
    }
    .btn-share {
      background: #059669;
      border-color: #10b981;
      color: #fff;
      font-weight: bold;
    }
    .btn-header:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* منطقة عرض الكاميرا */
    .camera-container {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video, #previewImg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #previewImg { display: none; }

    /* مؤشر التركيز باللمس */
    .focus-ring {
      position: absolute;
      width: 64px;
      height: 64px;
      border: 2px solid #facc15;
      border-radius: 12px;
      transform: translate(-50%, -50%) scale(1.2);
      pointer-events: none;
      opacity: 0;
      transition: transform 0.15s ease-out, opacity 0.2s;
      z-index: 15;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
    }
    .focus-ring.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* أزرار الكاميرا العائمة (فلاش + تقريب) */
    .cam-overlay-tools {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 15;
    }
    .floating-tool-btn {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 10px;
      border-radius: 99px;
      font-size: 12px;
      cursor: pointer;
    }
    .floating-tool-btn.torch-on {
      background: #eab308;
      color: #0f172a;
      font-weight: bold;
      border-color: #fef08a;
    }

    /* شريط التقريب Zoom */
    .zoom-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      padding: 5px 12px;
      border-radius: 99px;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 15;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .zoom-bar input[type="range"] {
      width: 130px;
      accent-color: #38bdf8;
    }
    .zoom-label {
      font-size: 11px;
      font-weight: bold;
      color: #38bdf8;
      min-width: 30px;
      text-align: center;
      direction: ltr;
    }

    /* إشعار عائم للتأكيد السريع */
    .toast {
      position: absolute;
      top: 52px;
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      padding: 7px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 25;
    }
    .toast.show { opacity: 1; }

    /* شريط آخر 5 صور المحفوظة */
    .history-bar {
      background: #0f172a;
      padding: 7px 12px;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #1e293b;
      min-height: 40px;
      z-index: 10;
    }
    .drawer-toggle-btn {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 13px;
    }
    .history-items-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      flex: 1;
    }
    .history-item {
      display: inline-block;
      background: #1e293b;
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      cursor: pointer;
      direction: ltr;
      font-weight: 600;
      font-size: 12px;
    }

    /* القائمة العمودية الجانبية */
    .side-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      z-index: 40;
    }
    .side-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 270px;
      max-width: 82vw;
      background: #1e293b;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      z-index: 45;
      transform: translateX(100%);
      transition: transform 0.22s ease-out;
      box-shadow: -8px 0 25px rgba(0,0,0,0.6);
    }
    .side-drawer.open { transform: translateX(0); }
    .drawer-header {
      padding: 14px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
    }
    .drawer-close {
      background: #334155;
      color: #f8fafc;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .drawer-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .drawer-photo-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 6px 8px;
      border-radius: 8px;
    }
    .drawer-card-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      overflow: hidden;
      cursor: pointer;
    }
    .drawer-thumb {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      background: #000;
      flex-shrink: 0;
    }
    .drawer-photo-name {
      font-size: 13px;
      font-weight: bold;
      color: #38bdf8;
      direction: ltr;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .drawer-card-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .drawer-icon-btn {
      background: transparent;
      border: none;
      padding: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    /* نافذة معاينة الصورة */
    .viewer-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.96);
      display: none;
      flex-direction: column;
      z-index: 60;
    }
    .viewer-header {
      padding: 12px 16px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .viewer-title {
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
      direction: ltr;
    }
    .viewer-close-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .viewer-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }
    .viewer-body img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
      object-fit: contain;
    }

    /* أزرار التحكم السفلية */
    .controls {
      padding: 14px 20px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #334155;
      z-index: 10;
    }
    .shutter-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid #94a3b8;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .shutter-btn:active { transform: scale(0.92); }

    .secondary-btn {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      min-width: 85px;
    }

    /* نافذة التسمية المنبثقة */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(3px);
      display: none;
      flex-direction: column;
      justify-content: flex-start;
      padding: 12px;
      padding-top: 18px;
      z-index: 50;
    }
    .modal-card {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 13px; color: #e2e8f0; }
    .kb-toggle {
      background: #334155;
      color: #93c5fd;
      border: 1px solid #475569;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
    input[type="search"], input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 10px;
      border: 2px solid #3b82f6;
      background: #0f172a;
      color: #fff;
      outline: none;
      text-align: center;
      direction: ltr;
      -webkit-appearance: none;
    }

    /* أزرار اللواحق السريعة */
    .quick-suffixes {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .suffix-chip {
      background: #0f172a;
      color: #93c5fd;
      border: 1px solid #334155;
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      direction: ltr;
    }
    .suffix-chip:active {
      background: #2563eb;
      color: #fff;
    }

    /* تنبيه تكرار الاسم */
    .duplicate-box {
      display: none;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid #f59e0b;
      border-radius: 10px;
      padding: 8px;
      flex-direction: column;
      gap: 7px;
    }
    .duplicate-msg {
      color: #fbbf24;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }
    .duplicate-actions {
      display: flex;
      gap: 6px;
    }
    .btn-dup-auto {
      flex: 1;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-dup-replace {
      flex: 1;
      background: #d97706;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
    }
    .btn-save {
      flex: 2;
      padding: 11px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-cancel {
      flex: 1;
      padding: 11px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
    canvas { display: none; }
  </style>
</head>
<body>

  <header>
    <span class="app-title">كاميرا الزعيم للتصوير</span>

    <div class="header-actions">
      <button class="btn-header" id="qualityBtn" title="تغيير دقة وحجم الصور">عالية</button>
      <button class="btn-header" id="pickFolderBtn" title="تحديد مجلد للحفظ المباشر">📁 <span id="folderLabel">مجلد</span></button>
      <button class="btn-header btn-share" id="shareZipBtn" disabled title="مشاركة عبر واتساب أو تيليغرام">📤</button>
      <button class="btn-header btn-zip" id="exportZipBtn" disabled>📦 ZIP (<span id="zipCount">0</span>)</button>
    </div>
  </header>

  <div class="camera-container" id="cameraContainer">
    <div class="toast" id="toastMsg">تم الحفظ</div>

    <!-- أدوات الكاميرا العائمة -->
    <div class="cam-overlay-tools">
      <button class="floating-tool-btn" id="torchBtn" style="display:none;">🔦 فلاش</button>
      <span class="floating-tool-btn" id="offlineBadge" style="display:none; background:#b45309;">وضع أوفلاين</span>
    </div>

    <!-- إطار التركيز باللمس -->
    <div class="focus-ring" id="focusRing"></div>

    <!-- شريط التقريب Zoom -->
    <div class="zoom-bar" id="zoomBar">
      <span class="zoom-label" id="zoomValue">1.0x</span>
      <input type="range" id="zoomSlider" min="1" max="4" step="0.1" value="1">
    </div>

    <video id="video" autoplay playsinline></video>
    <img id="previewImg" alt="معاينة">
    <canvas id="canvas"></canvas>
  </div>

  <!-- شريط آخر 5 صور مع زر فتح القائمة الجانبية -->
  <div class="history-bar">
    <button class="drawer-toggle-btn" id="openDrawerBtn" title="عرض كل الصور المصورة">▲</button>
    <span>آخر 5:</span>
    <div class="history-items-wrap" id="historyList">
      <span style="color:#64748b;">لا يوجد بعد</span>
    </div>
  </div>

  <div class="controls">
    <button class="secondary-btn" id="switchCamBtn">تبديل الكاميرا</button>
    <button class="shutter-btn" id="captureBtn" aria-label="التقاط"></button>
    <button class="secondary-btn" id="clearSessionBtn">مسح الجلسة</button>
  </div>

  <!-- القائمة العمودية الجانبية لجميع الصور -->
  <div class="side-drawer-overlay" id="drawerOverlay"></div>
  <aside class="side-drawer" id="sideDrawer">
    <div class="drawer-header">
      <span>الصور المحفوظة (<span id="drawerTotalCount">0</span>)</span>
      <button class="drawer-close" id="closeDrawerBtn">✕</button>
    </div>
    <div class="drawer-list" id="drawerList">
      <p style="color:#64748b; font-size:13px; text-align:center; margin-top:20px;">لم يتم التقاط صور بعد</p>
    </div>
  </aside>

  <!-- نافذة معاينة الصورة -->
  <div class="viewer-modal" id="photoViewerModal">
    <div class="viewer-header">
      <span class="viewer-title" id="viewerFileName">10.jpg</span>
      <button class="viewer-close-btn" id="closeViewerBtn">إغلاق والمتابعة</button>
    </div>
    <div class="viewer-body">
      <img id="viewerFullImg" src="" alt="معاينة الصورة">
    </div>
  </div>

  <!-- نافذة إدخال الاسم -->
  <div class="modal-overlay" id="renameModal">
    <form class="modal-card" id="renameForm" autocomplete="off">
      <div class="modal-header">
        <h3 id="modalTitleText">أدخل رقم أو اسم الصورة:</h3>
        <button type="button" class="kb-toggle" id="toggleKbBtn">لوحة: أرقام 123</button>
      </div>

      <input type="search" id="fileNameInput" inputmode="numeric" enterkeyhint="done" placeholder="10" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required>

      <!-- أزرار اللواحق السريعة بلمسة واحدة -->
      <div class="quick-suffixes">
        <button type="button" class="suffix-chip" data-suffix="-1">-1</button>
        <button type="button" class="suffix-chip" data-suffix="-2">-2</button>
        <button type="button" class="suffix-chip" data-suffix="-3">-3</button>
        <button type="button" class="suffix-chip" data-suffix="-أمام">أمام</button>
        <button type="button" class="suffix-chip" data-suffix="-خلف">خلف</button>
      </div>

      <!-- تنبيه التكرار الذكي -->
      <div class="duplicate-box" id="duplicateBox">
        <div class="duplicate-msg" id="duplicateMsgText">⚠️ الاسم موجود مسبقاً!</div>
        <div class="duplicate-actions">
          <button type="button" class="btn-dup-auto" id="saveNextSeqBtn">حفظ باسم 10-2</button>
          <button type="button" class="btn-dup-replace" id="replaceOldBtn">استبدال القديمة</button>
        </div>
      </div>

      <div class="modal-actions">
        <button type="submit" class="btn-save">حفظ</button>
        <button type="button" class="btn-cancel" id="discardBtn">إلغاء</button>
      </div>
    </form>
  </div>

  <script>
    // تسجيل Service Worker للعمل بدون إنترنت (PWA)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    const cameraContainer = document.getElementById('cameraContainer');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const previewImg = document.getElementById('previewImg');
    const captureBtn = document.getElementById('captureBtn');
    const switchCamBtn = document.getElementById('switchCamBtn');
    const clearSessionBtn = document.getElementById('clearSessionBtn');
    const pickFolderBtn = document.getElementById('pickFolderBtn');
    const folderLabel = document.getElementById('folderLabel');
    const qualityBtn = document.getElementById('qualityBtn');
    const shareZipBtn = document.getElementById('shareZipBtn');
    const exportZipBtn = document.getElementById('exportZipBtn');
    const toastMsg = document.getElementById('toastMsg');

    const torchBtn = document.getElementById('torchBtn');
    const zoomBar = document.getElementById('zoomBar');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomValue = document.getElementById('zoomValue');
    const focusRing = document.getElementById('focusRing');
    const offlineBadge = document.getElementById('offlineBadge');

    const renameModal = document.getElementById('renameModal');
    const modalTitleText = document.getElementById('modalTitleText');
    const renameForm = document.getElementById('renameForm');
    const fileNameInput = document.getElementById('fileNameInput');
    const toggleKbBtn = document.getElementById('toggleKbBtn');
    const discardBtn = document.getElementById('discardBtn');
    const duplicateBox = document.getElementById('duplicateBox');
    const duplicateMsgText = document.getElementById('duplicateMsgText');
    const saveNextSeqBtn = document.getElementById('saveNextSeqBtn');
    const replaceOldBtn = document.getElementById('replaceOldBtn');
    const historyList = document.getElementById('historyList');

    const openDrawerBtn = document.getElementById('openDrawerBtn');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerList = document.getElementById('drawerList');
    const drawerTotalCount = document.getElementById('drawerTotalCount');

    const photoViewerModal = document.getElementById('photoViewerModal');
    const viewerFileName = document.getElementById('viewerFileName');
    const viewerFullImg = document.getElementById('viewerFullImg');
    const closeViewerBtn = document.getElementById('closeViewerBtn');

    let currentStream = null;
    let videoTrack = null;
    let useBackCamera = true;
    let torchEnabled = false;
    let capturedBlob = null;
    let capturedDataUrl = null;
    let directoryHandle = null;
    let sessionPhotos = [];
    let isNumericMode = true;
    let db = null;
    let editingIndex = null; // لتتبع تعديل اسم صورة موجودة

    // إعدادات الجودة
    const qualityLevels = [
      { label: 'عالية', maxDim: 1920, q: 0.92 },
      { label: 'متوسطة', maxDim: 1280, q: 0.82 },
      { label: 'خفيفة', maxDim: 960, q: 0.72 }
    ];
    let currentQualityIdx = 0;

    qualityBtn.addEventListener('click', () => {
      currentQualityIdx = (currentQualityIdx + 1) % qualityLevels.length;
      qualityBtn.textContent = qualityLevels[currentQualityIdx].label;
      showToast(`الدقة: ${qualityLevels[currentQualityIdx].label}`);
    });

    // مراقبة حالة الاتصال بالإنترنت
    function updateOnlineStatus() {
      offlineBadge.style.display = navigator.onLine ? 'none' : 'inline-block';
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // قاعدة البيانات المحلية الدائمة (IndexedDB)
    function initDB() {
      return new Promise((resolve) => {
        const request = indexedDB.open('AlzaeemCameraDB', 1);
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('photos')) {
            database.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          loadPhotosFromDB();
          resolve();
        };
        request.onerror = () => resolve();
      });
    }

    function savePhotoToDB(photoObj) {
      if (!db) return;
      const tx = db.transaction('photos', 'readwrite');
      const req = tx.objectStore('photos').add({ name: photoObj.name, blob: photoObj.blob });
      req.onsuccess = (e) => { photoObj.id = e.target.result; };
    }

    function updatePhotoInDB(photoObj) {
      if (!db || !photoObj.id) return;
      const tx = db.transaction('photos', 'readwrite');
      tx.objectStore('photos').put({ id: photoObj.id, name: photoObj.name, blob: photoObj.blob });
    }

    function deletePhotoFromDB(id) {
      if (!db || !id) return;
      const tx = db.transaction('photos', 'readwrite');
      tx.objectStore('photos').delete(id);
    }

    function clearDB() {
      if (!db) return;
      const tx = db.transaction('photos', 'readwrite');
      tx.objectStore('photos').clear();
    }

    function loadPhotosFromDB() {
      if (!db) return;
      const tx = db.transaction('photos', 'readonly');
      const req = tx.objectStore('photos').getAll();
      req.onsuccess = () => {
        const records = req.result || [];
        sessionPhotos = records.map(r => ({
          id: r.id,
          name: r.name,
          blob: r.blob,
          dataUrl: URL.createObjectURL(r.blob)
        }));
        updateHistoryUI();
      };
    }

    function showToast(text) {
      toastMsg.textContent = text;
      toastMsg.classList.add('show');
      setTimeout(() => toastMsg.classList.remove('show'), 1600);
    }

    // اختيار مجلد للحفظ المباشر
    pickFolderBtn.addEventListener('click', async () => {
      if (!('showDirectoryPicker' in window)) {
        alert('هذا المتصفح لا يدعم ربط مجلد مباشر. يتم حفظ الصور تلقائياً بصمت داخل التطبيق ويمكنك تنزيلها أو مشاركتها كملف ZIP.');
        return;
      }
      try {
        directoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        folderLabel.textContent = directoryHandle.name;
        pickFolderBtn.classList.add('btn-active-green');
        showToast(`✓ المجلد: ${directoryHandle.name}`);
      } catch (err) {
        if (err.name !== 'AbortError') alert('لم يتم منح صلاحية الوصول للمجلد.');
      }
    });

    // القائمة الجانبية والمعاينة
    function openDrawer() {
      drawerOverlay.style.display = 'block';
      requestAnimationFrame(() => sideDrawer.classList.add('open'));
    }
    function closeDrawer() {
      sideDrawer.classList.remove('open');
      setTimeout(() => { drawerOverlay.style.display = 'none'; }, 220);
    }
    openDrawerBtn.addEventListener('click', openDrawer);
    closeDrawerBtn.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);

    function openPhotoViewer(index) {
      const photo = sessionPhotos[index];
      if (!photo) return;
      viewerFileName.textContent = photo.name;
      viewerFullImg.src = photo.dataUrl;
      photoViewerModal.style.display = 'flex';
    }
    closeViewerBtn.addEventListener('click', () => {
      photoViewerModal.style.display = 'none';
      viewerFullImg.src = '';
    });

    function deleteSinglePhoto(index) {
      const photo = sessionPhotos[index];
      if (!photo) return;
      if (confirm(`حذف الصورة ${photo.name}؟`)) {
        deletePhotoFromDB(photo.id);
        URL.revokeObjectURL(photo.dataUrl);
        sessionPhotos.splice(index, 1);
        updateHistoryUI();
      }
    }

    // فتح نافذة تعديل اسم صورة محفوظة سابقاً
    function editExistingPhotoName(index) {
      const photo = sessionPhotos[index];
      if (!photo) return;
      closeDrawer();
      editingIndex = index;
      modalTitleText.textContent = 'تعديل اسم الصورة:';
      fileNameInput.value = photo.name.replace(/\.jpg$/i, '');
      duplicateBox.style.display = 'none';
      renameModal.style.display = 'flex';
      setTimeout(() => { fileNameInput.focus(); fileNameInput.select(); }, 60);
    }

    toggleKbBtn.addEventListener('click', () => {
      isNumericMode = !isNumericMode;
      fileNameInput.setAttribute('inputmode', isNumericMode ? 'numeric' : 'text');
      toggleKbBtn.textContent = isNumericMode ? 'لوحة: أرقام 123' : 'لوحة: نص ABC';
      fileNameInput.blur();
      setTimeout(() => fileNameInput.focus(), 50);
    });

    // أزرار اللواحق السريعة (-1, -2, أمام, خلف)
    document.querySelectorAll('.suffix-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const suffix = btn.getAttribute('data-suffix');
        fileNameInput.value = fileNameInput.value.trim() + suffix;
        checkDuplicateName();
        fileNameInput.focus();
      });
    });

    // تشغيل الكاميرا وتفعيل الفلاش والتقريب
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      torchEnabled = false;
      torchBtn.classList.remove('torch-on');
      torchBtn.style.display = 'none';
      zoomBar.style.display = 'none';

      try {
        const constraints = {
          video: {
            facingMode: useBackCamera ? { ideal: 'environment' } : 'user',
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        videoTrack = currentStream.getVideoTracks()[0];

        // فحص دعم الفلاش والتقريب في العدسة
        if (videoTrack && 'getCapabilities' in videoTrack) {
          const caps = videoTrack.getCapabilities();
          if (caps.torch) {
            torchBtn.style.display = 'inline-block';
          }
          if (caps.zoom) {
            zoomBar.style.display = 'flex';
            zoomSlider.min = caps.zoom.min || 1;
            zoomSlider.max = Math.min(caps.zoom.max || 4, 6);
            zoomSlider.step = caps.zoom.step || 0.1;
            zoomSlider.value = caps.zoom.min || 1;
            zoomValue.textContent = `${Number(zoomSlider.value).toFixed(1)}x`;
          }
        }
      } catch (err) {
        alert('تعذر الوصول إلى الكاميرا. تأكد من منح صلاحية الكاميرا للمتصفح.');
      }
    }

    // زر الفلاش
    torchBtn.addEventListener('click', async () => {
      if (!videoTrack) return;
      try {
        torchEnabled = !torchEnabled;
        await videoTrack.applyConstraints({ advanced: [{ torch: torchEnabled }] });
        torchBtn.classList.toggle('torch-on', torchEnabled);
      } catch (e) {
        showToast('الفلاش غير مدعوم في هذه العدسة');
      }
    });

    // شريط التقريب Zoom
    zoomSlider.addEventListener('input', async () => {
      if (!videoTrack) return;
      const val = Number(zoomSlider.value);
      zoomValue.textContent = `${val.toFixed(1)}x`;
      try {
        await videoTrack.applyConstraints({ advanced: [{ zoom: val }] });
      } catch (e) {}
    });

    // التركيز باللمس على الشاشة
    cameraContainer.addEventListener('click', async (e) => {
      if (e.target.closest('button') || e.target.closest('.zoom-bar')) return;
      const rect = cameraContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      focusRing.style.left = `${x}px`;
      focusRing.style.top = `${y}px`;
      focusRing.classList.add('active');
      setTimeout(() => focusRing.classList.remove('active'), 650);

      if (videoTrack && 'getCapabilities' in videoTrack) {
        const caps = videoTrack.getCapabilities();
        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          try {
            await videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
          } catch (err) {}
        }
      }
    });

    switchCamBtn.addEventListener('click', () => {
      useBackCamera = !useBackCamera;
      startCamera();
    });

    // التقاط الصورة
    function triggerCapture() {
      if (!video.videoWidth || renameModal.style.display === 'flex') return;

      const qSetting = qualityLevels[currentQualityIdx];
      let w = video.videoWidth;
      let h = video.videoHeight;

      if (Math.max(w, h) > qSetting.maxDim) {
        const ratio = qSetting.maxDim / Math.max(w, h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);

      capturedDataUrl = canvas.toDataURL('image/jpeg', qSetting.q);
      canvas.toBlob((blob) => {
        capturedBlob = blob;
      }, 'image/jpeg', qSetting.q);

      previewImg.src = capturedDataUrl;
      previewImg.style.display = 'block';
      video.style.display = 'none';

      editingIndex = null;
      modalTitleText.textContent = 'أدخل رقم أو اسم الصورة:';
      fileNameInput.value = '';
      duplicateBox.style.display = 'none';
      renameModal.style.display = 'flex';
      setTimeout(() => fileNameInput.focus(), 60);
    }

    captureBtn.addEventListener('click', triggerCapture);

    // دعم التصوير بأزرار رفع/خفض الصوت في الهاتف
    window.addEventListener('keydown', (e) => {
      if (e.key === 'AudioVolumeUp' || e.key === 'AudioVolumeDown') {
        if (renameModal.style.display !== 'flex' && photoViewerModal.style.display !== 'flex') {
          e.preventDefault();
          triggerCapture();
        }
      }
    });

    // فحص تكرار الاسم أثناء الكتابة
    function getNextAvailableName(baseName) {
      let counter = 2;
      let candidate = `${baseName}-${counter}.jpg`;
      while (sessionPhotos.some((p, idx) => idx !== editingIndex && p.name.toLowerCase() === candidate.toLowerCase())) {
        counter++;
        candidate = `${baseName}-${counter}.jpg`;
      }
      return candidate;
    }

    function checkDuplicateName() {
      const raw = fileNameInput.value.trim().replace(/[\\/:*?"<>|]/g, '-');
      if (!raw) {
        duplicateBox.style.display = 'none';
        return null;
      }
      const targetName = `${raw}.jpg`;
      const existingIdx = sessionPhotos.findIndex((p, idx) => idx !== editingIndex && p.name.toLowerCase() === targetName.toLowerCase());

      if (existingIdx !== -1) {
        const nextName = getNextAvailableName(raw);
        duplicateMsgText.textContent = `⚠️ الاسم (${targetName}) مستخدم مسبقاً!`;
        saveNextSeqBtn.textContent = `حفظ باسم ${nextName.replace('.jpg', '')}`;
        saveNextSeqBtn.dataset.nextName = nextName;
        duplicateBox.style.display = 'flex';
        return existingIdx;
      } else {
        duplicateBox.style.display = 'none';
        return -1;
      }
    }

    fileNameInput.addEventListener('input', checkDuplicateName);

    // زر الحفظ برقم تسلسلي تلقائي عند التكرار
    saveNextSeqBtn.addEventListener('click', () => {
      const nextFull = saveNextSeqBtn.dataset.nextName;
      if (nextFull) {
        finalizeSave(nextFull, -1);
      }
    });

    // زر استبدال الصورة القديمة عند التكرار
    replaceOldBtn.addEventListener('click', () => {
      const raw = fileNameInput.value.trim().replace(/[\\/:*?"<>|]/g, '-');
      const targetName = `${raw}.jpg`;
      const existingIdx = sessionPhotos.findIndex((p, idx) => idx !== editingIndex && p.name.toLowerCase() === targetName.toLowerCase());
      finalizeSave(targetName, existingIdx);
    });

    // حفظ النموذج الأساسي
    renameForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const rawName = fileNameInput.value.trim();
      if (!rawName) return;

      const safeName = rawName.replace(/[\\/:*?"<>|]/g, '-');
      const finalFileName = `${safeName}.jpg`;

      // إذا كان الاسم مكرراً ولم يضغط المستخدم على خيارات التكرار بعد، نظهر التنبيه أولاً
      const dupIdx = checkDuplicateName();
      if (dupIdx !== -1 && duplicateBox.dataset.warned !== finalFileName) {
        duplicateBox.dataset.warned = finalFileName;
        return;
      }
      duplicateBox.dataset.warned = '';

      finalizeSave(finalFileName, -1);
    });

    async function finalizeSave(finalFileName, replaceIndex) {
      // حالة 1: تعديل اسم صورة موجودة مسبقاً
      if (editingIndex !== null) {
        const item = sessionPhotos[editingIndex];
        item.name = finalFileName;
        updatePhotoInDB(item);
        updateHistoryUI();
        showToast(`✓ تم التعديل إلى: ${finalFileName}`);
        resetToCamera();
        return;
      }

      if (!capturedBlob) return;

      // حالة 2: استبدال صورة قديمة بنفس الاسم
      if (replaceIndex !== -1) {
        const oldItem = sessionPhotos[replaceIndex];
        URL.revokeObjectURL(oldItem.dataUrl);
        oldItem.name = finalFileName;
        oldItem.blob = capturedBlob;
        oldItem.dataUrl = capturedDataUrl;
        updatePhotoInDB(oldItem);
      } else {
        // حالة 3: حفظ صورة جديدة
        const photoObj = {
          name: finalFileName,
          blob: capturedBlob,
          dataUrl: capturedDataUrl
        };
        sessionPhotos.push(photoObj);
        savePhotoToDB(photoObj);
      }

      updateHistoryUI();

      // الحفظ المباشر في المجلد إن كان محدداً
      if (directoryHandle) {
        try {
          const fileHandle = await directoryHandle.getFileHandle(finalFileName, { create: true });
          const writable = await fileHandle.createWritable();
          await writable.write(capturedBlob);
          await writable.close();
          showToast(`✓ حُفظت في المجلد: ${finalFileName}`);
        } catch (err) {
          showToast(`✓ حُفظت: ${finalFileName}`);
        }
      } else {
        showToast(`✓ حُفظت: ${finalFileName}`);
      }

      resetToCamera();
    }

    // بناء ملف ZIP (مشترك بين التنزيل والمشاركة)
    async function buildZipFile() {
      const zip = new JSZip();
      const usedNames = {};

      for (const item of sessionPhotos) {
        let fileName = item.name;
        if (usedNames[fileName]) {
          usedNames[fileName]++;
          const base = fileName.replace(/\.jpg$/i, '');
          fileName = `${base}_${usedNames[item.name]}.jpg`;
        } else {
          usedNames[fileName] = 1;
        }
        zip.file(fileName, item.blob);
      }

      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const dateStr = new Date().toISOString().slice(0, 10);
      return { blob: zipBlob, fileName: `Alzaeem_Photos_${dateStr}.zip` };
    }

    // تنزيل ZIP
    exportZipBtn.addEventListener('click', async () => {
      if (sessionPhotos.length === 0) return;
      exportZipBtn.disabled = true;
      exportZipBtn.textContent = 'جاري الضغط...';

      try {
        const { blob, fileName } = await buildZipFile();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        showToast('✓ تم تنزيل ملف ZIP');
      } catch (err) {
        alert('حدث خطأ أثناء إنشاء ملف ZIP.');
      } finally {
        exportZipBtn.disabled = false;
        exportZipBtn.innerHTML = `📦 ZIP (<span id="zipCount">${sessionPhotos.length}</span>)`;
      }
    });

    // مشاركة ZIP مباشرة عبر واتساب / تيليغرام
    shareZipBtn.addEventListener('click', async () => {
      if (sessionPhotos.length === 0) return;
      shareZipBtn.disabled = true;

      try {
        const { blob, fileName } = await buildZipFile();
        const file = new File([blob], fileName, { type: 'application/zip' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: 'صور كاميرا الزعيم',
            text: `مرفق ${sessionPhotos.length} صورة مرقمة`
          });
        } else {
          alert('متصفحك لا يدعم المشاركة المباشرة للملفات المضغوطة. استخدم زر ZIP لتنزيل الملف ثم أرسله.');
        }
      } catch (err) {
        if (err.name !== 'AbortError') showToast('تعذرت المشاركة');
      } finally {
        shareZipBtn.disabled = sessionPhotos.length === 0;
      }
    });

    clearSessionBtn.addEventListener('click', () => {
      if (sessionPhotos.length === 0) return;
      if (confirm('هل تريد مسح جميع الصور المحفوظة في هذه الجلسة؟')) {
        sessionPhotos.forEach(p => URL.revokeObjectURL(p.dataUrl));
        sessionPhotos = [];
        clearDB();
        updateHistoryUI();
        closeDrawer();
        showToast('تم مسح الجلسة');
      }
    });

    function updateHistoryUI() {
      const count = sessionPhotos.length;
      const zipSpan = document.getElementById('zipCount');
      if (zipSpan) zipSpan.textContent = count;
      drawerTotalCount.textContent = count;
      exportZipBtn.disabled = count === 0;
      shareZipBtn.disabled = count === 0;

      if (count === 0) {
        historyList.innerHTML = '<span style="color:#64748b;">لا يوجد بعد</span>';
        drawerList.innerHTML = '<p style="color:#64748b; font-size:13px; text-align:center; margin-top:20px;">لم يتم التقاط صور بعد</p>';
        return;
      }

      const lastFive = sessionPhotos
        .map((item, idx) => ({ ...item, originalIndex: idx }))
        .slice(-5)
        .reverse();

      historyList.innerHTML = lastFive
        .map(item => `<span class="history-item" onclick="openPhotoViewer(${item.originalIndex})">${item.name}</span>`)
        .join('');

      const allReversed = sessionPhotos
        .map((item, idx) => ({ ...item, originalIndex: idx }))
        .reverse();

      drawerList.innerHTML = allReversed
        .map(item => `
          <div class="drawer-photo-card">
            <div class="drawer-card-left" onclick="openPhotoViewer(${item.originalIndex})">
              <img class="drawer-thumb" src="${item.dataUrl}" alt="${item.name}">
              <span class="drawer-photo-name">${item.name}</span>
            </div>
            <div class="drawer-card-actions">
              <button class="drawer-icon-btn" onclick="editExistingPhotoName(${item.originalIndex})" title="تعديل الاسم">✏️</button>
              <button class="drawer-icon-btn" onclick="deleteSinglePhoto(${item.originalIndex})" title="حذف">🗑️</button>
            </div>
          </div>
        `)
        .join('');
    }

    discardBtn.addEventListener('click', resetToCamera);

    function resetToCamera() {
      capturedBlob = null;
      capturedDataUrl = null;
      editingIndex = null;
      duplicateBox.style.display = 'none';
      duplicateBox.dataset.warned = '';
      renameModal.style.display = 'none';
      previewImg.style.display = 'none';
      video.style.display = 'block';
    }

    initDB();
    startCamera();
  </script>
</body>
</html>
