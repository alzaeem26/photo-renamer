<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0f172a">
  <meta name="application-name" content="كاميرا الزعيم للتصوير">
  <meta name="apple-mobile-web-app-title" content="كاميرا الزعيم للتصوير">
  <title>كاميرا الزعيم للتصوير</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* الشريط العلوي */
    header {
      padding: 10px 14px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      border-bottom: 1px solid #334155;
      z-index: 10;
    }
    .app-title {
      font-weight: bold;
      font-size: 14px;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-header {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-folder-active {
      background: #065f46;
      border-color: #10b981;
      color: #ecfdf5;
    }
    .btn-zip {
      background: #2563eb;
      border-color: #3b82f6;
      font-weight: bold;
    }
    .btn-zip:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* منطقة عرض الكاميرا */
    .camera-container {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video, #previewImg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #previewImg { display: none; }

    /* إشعار عائم للتأكيد السريع */
    .toast {
      position: absolute;
      top: 16px;
      background: rgba(16, 185, 129, 0.95);
      color: #fff;
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      z-index: 20;
    }
    .toast.show { opacity: 1; }

    /* شريط آخر 5 صور المحفوظة */
    .history-bar {
      background: #0f172a;
      padding: 7px 12px;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid #1e293b;
      min-height: 40px;
      z-index: 10;
    }
    .drawer-toggle-btn {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 13px;
    }
    .drawer-toggle-btn:active {
      background: #334155;
    }
    .history-items-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      flex: 1;
    }
    .history-item {
      display: inline-block;
      background: #1e293b;
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      cursor: pointer;
      direction: ltr;
      font-weight: 600;
      font-size: 12px;
    }
    .history-item:active {
      background: #334155;
    }

    /* القائمة العمودية الجانبية للصور المصورة */
    .side-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      z-index: 40;
    }
    .side-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 240px;
      max-width: 75vw;
      background: #1e293b;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      z-index: 45;
      transform: translateX(100%);
      transition: transform 0.22s ease-out;
      box-shadow: -8px 0 25px rgba(0,0,0,0.6);
    }
    .side-drawer.open {
      transform: translateX(0);
    }
    .drawer-header {
      padding: 14px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: bold;
    }
    .drawer-close {
      background: #334155;
      color: #f8fafc;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .drawer-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .drawer-photo-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
    }
    .drawer-photo-card:active {
      border-color: #38bdf8;
    }
    .drawer-thumb {
      width: 42px;
      height: 42px;
      border-radius: 6px;
      object-fit: cover;
      background: #000;
      flex-shrink: 0;
    }
    .drawer-photo-name {
      font-size: 14px;
      font-weight: bold;
      color: #38bdf8;
      direction: ltr;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* نافذة معاينة الصورة عند الضغط عليها */
    .viewer-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      display: none;
      flex-direction: column;
      z-index: 60;
    }
    .viewer-header {
      padding: 12px 16px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .viewer-title {
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
      direction: ltr;
    }
    .viewer-close-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .viewer-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }
    .viewer-body img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
      object-fit: contain;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    /* أزرار التحكم السفلية */
    .controls {
      padding: 16px 20px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #334155;
      z-index: 10;
    }
    .shutter-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid #94a3b8;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .shutter-btn:active { transform: scale(0.92); }

    .secondary-btn {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      min-width: 85px;
    }

    /* نافذة التسمية المنبثقة */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(3px);
      display: none;
      flex-direction: column;
      justify-content: flex-start;
      padding: 16px;
      padding-top: 24px;
      z-index: 50;
    }
    .modal-card {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 14px; color: #e2e8f0; }
    .kb-toggle {
      background: #334155;
      color: #93c5fd;
      border: 1px solid #475569;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    input[type="search"], input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 10px;
      border: 2px solid #3b82f6;
      background: #0f172a;
      color: #fff;
      outline: none;
      text-align: center;
      direction: ltr;
      -webkit-appearance: none;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
    }
    .btn-save {
      flex: 2;
      padding: 12px;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-cancel {
      flex: 1;
      padding: 12px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    canvas { display: none; }
  </style>
</head>
<body>

  <header>
    <span class="app-title">كاميرا الزعيم للتصوير</span>

    <div class="header-actions">
      <button class="btn-header" id="pickFolderBtn" title="تحديد مجلد للحفظ المباشر بدون إشعارات">
        📁 <span id="folderLabel">مجلد</span>
      </button>
      <button class="btn-header btn-zip" id="exportZipBtn" disabled>
        📦 ZIP (<span id="zipCount">0</span>)
      </button>
    </div>
  </header>

  <div class="camera-container">
    <div class="toast" id="toastMsg">تم الحفظ</div>
    <video id="video" autoplay playsinline></video>
    <img id="previewImg" alt="معاينة">
    <canvas id="canvas"></canvas>
  </div>

  <!-- شريط آخر 5 صور مع زر فتح القائمة الجانبية -->
  <div class="history-bar">
    <button class="drawer-toggle-btn" id="openDrawerBtn" title="عرض كل الصور المصورة">▲</button>
    <span>آخر 5:</span>
    <div class="history-items-wrap" id="historyList">
      <span style="color:#64748b;">لا يوجد بعد</span>
    </div>
  </div>

  <div class="controls">
    <button class="secondary-btn" id="switchCamBtn">تبديل الكاميرا</button>
    <button class="shutter-btn" id="captureBtn" aria-label="التقاط"></button>
    <button class="secondary-btn" id="clearSessionBtn">مسح الجلسة</button>
  </div>

  <!-- القائمة العمودية الجانبية لجميع الصور -->
  <div class="side-drawer-overlay" id="drawerOverlay"></div>
  <aside class="side-drawer" id="sideDrawer">
    <div class="drawer-header">
      <span>الصور المصورة (<span id="drawerTotalCount">0</span>)</span>
      <button class="drawer-close" id="closeDrawerBtn">✕</button>
    </div>
    <div class="drawer-list" id="drawerList">
      <p style="color:#64748b; font-size:13px; text-align:center; margin-top:20px;">لم يتم التقاط صور بعد</p>
    </div>
  </aside>

  <!-- نافذة معاينة الصورة عند الضغط عليها -->
  <div class="viewer-modal" id="photoViewerModal">
    <div class="viewer-header">
      <span class="viewer-title" id="viewerFileName">10.jpg</span>
      <button class="viewer-close-btn" id="closeViewerBtn">إغلاق والمتابعة</button>
    </div>
    <div class="viewer-body">
      <img id="viewerFullImg" src="" alt="معاينة الصورة">
    </div>
  </div>

  <!-- نافذة إدخال الاسم -->
  <div class="modal-overlay" id="renameModal">
    <form class="modal-card" id="renameForm" autocomplete="off">
      <div class="modal-header">
        <h3>أدخل رقم أو اسم الصورة:</h3>
        <button type="button" class="kb-toggle" id="toggleKbBtn">لوحة: أرقام 123</button>
      </div>
      <input type="search" id="fileNameInput" inputmode="numeric" enterkeyhint="done" placeholder="10" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required>
      <div class="modal-actions">
        <button type="submit" class="btn-save">حفظ</button>
        <button type="button" class="btn-cancel" id="discardBtn">إلغاء</button>
      </div>
    </form>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const previewImg = document.getElementById('previewImg');
    const captureBtn = document.getElementById('captureBtn');
    const switchCamBtn = document.getElementById('switchCamBtn');
    const clearSessionBtn = document.getElementById('clearSessionBtn');
    const pickFolderBtn = document.getElementById('pickFolderBtn');
    const folderLabel = document.getElementById('folderLabel');
    const exportZipBtn = document.getElementById('exportZipBtn');
    const toastMsg = document.getElementById('toastMsg');

    const renameModal = document.getElementById('renameModal');
    const renameForm = document.getElementById('renameForm');
    const fileNameInput = document.getElementById('fileNameInput');
    const toggleKbBtn = document.getElementById('toggleKbBtn');
    const discardBtn = document.getElementById('discardBtn');
    const historyList = document.getElementById('historyList');

    // عناصر القائمة الجانبية والمعاينة
    const openDrawerBtn = document.getElementById('openDrawerBtn');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerList = document.getElementById('drawerList');
    const drawerTotalCount = document.getElementById('drawerTotalCount');

    const photoViewerModal = document.getElementById('photoViewerModal');
    const viewerFileName = document.getElementById('viewerFileName');
    const viewerFullImg = document.getElementById('viewerFullImg');
    const closeViewerBtn = document.getElementById('closeViewerBtn');

    let currentStream = null;
    let useBackCamera = true;
    let capturedBlob = null;
    let capturedDataUrl = null;
    let directoryHandle = null;
    let sessionPhotos = [];
    let isNumericMode = true;

    function showToast(text) {
      toastMsg.textContent = text;
      toastMsg.classList.add('show');
      setTimeout(() => toastMsg.classList.remove('show'), 1800);
    }

    // التحكم في القائمة الجانبية
    function openDrawer() {
      drawerOverlay.style.display = 'block';
      requestAnimationFrame(() => sideDrawer.classList.add('open'));
    }
    function closeDrawer() {
      sideDrawer.classList.remove('open');
      setTimeout(() => { drawerOverlay.style.display = 'none'; }, 220);
    }
    openDrawerBtn.addEventListener('click', openDrawer);
    closeDrawerBtn.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);

    // فتح معاينة أي صورة دون التأثير على الكاميرا أو الجلسة
    function openPhotoViewer(index) {
      const photo = sessionPhotos[index];
      if (!photo) return;
      viewerFileName.textContent = photo.name;
      viewerFullImg.src = photo.dataUrl;
      photoViewerModal.style.display = 'flex';
    }
    closeViewerBtn.addEventListener('click', () => {
      photoViewerModal.style.display = 'none';
      viewerFullImg.src = '';
    });

    pickFolderBtn.addEventListener('click', async () => {
      if (!('showDirectoryPicker' in window)) {
        alert('متصفحك الحالي لا يدعم الحفظ المباشر في مجلد محدد. سيتم تنزيل الصور تلقائياً إلى مجلد التنزيلات (Downloads) أو يمكنك تصديرها كملف ZIP.');
        return;
      }
      try {
        directoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        folderLabel.textContent = directoryHandle.name;
        pickFolderBtn.classList.add('btn-folder-active');
        showToast(`تم ربط المجلد: ${directoryHandle.name}`);
      } catch (err) {
        if (err.name !== 'AbortError') {
          alert('لم يتم منح صلاحية الوصول للمجلد.');
        }
      }
    });

    toggleKbBtn.addEventListener('click', () => {
      isNumericMode = !isNumericMode;
      fileNameInput.setAttribute('inputmode', isNumericMode ? 'numeric' : 'text');
      toggleKbBtn.textContent = isNumericMode ? 'لوحة: أرقام 123' : 'لوحة: نص ABC';
      fileNameInput.blur();
      setTimeout(() => fileNameInput.focus(), 50);
    });

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: useBackCamera ? { ideal: 'environment' } : 'user',
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
      } catch (err) {
        alert('تعذر الوصول إلى الكاميرا. تأكد من فتح الصفحة عبر HTTPS ومنح صلاحية الكاميرا.');
      }
    }

    switchCamBtn.addEventListener('click', () => {
      useBackCamera = !useBackCamera;
      startCamera();
    });

    captureBtn.addEventListener('click', () => {
      if (!video.videoWidth) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      capturedDataUrl = canvas.toDataURL('image/jpeg', 0.92);
      canvas.toBlob((blob) => {
        capturedBlob = blob;
      }, 'image/jpeg', 0.92);

      previewImg.src = capturedDataUrl;
      previewImg.style.display = 'block';
      video.style.display = 'none';

      fileNameInput.value = '';
      renameModal.style.display = 'flex';
      setTimeout(() => fileNameInput.focus(), 80);
    });

    renameForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      let rawName = fileNameInput.value.trim();
      if (!rawName || !capturedBlob) return;

      const safeName = rawName.replace(/[\\/:*?"<>|]/g, '-');
      const finalFileName = `${safeName}.jpg`;

      // حفظ الصورة مع رابط المعاينة في ذاكرة الجلسة
      sessionPhotos.push({
        name: finalFileName,
        blob: capturedBlob,
        dataUrl: capturedDataUrl
      });
      updateHistoryUI();

      if (directoryHandle) {
        try {
          const fileHandle = await directoryHandle.getFileHandle(finalFileName, { create: true });
          const writable = await fileHandle.createWritable();
          await writable.write(capturedBlob);
          await writable.close();
          showToast(`✓ حُفظت في المجلد: ${finalFileName}`);
        } catch (err) {
          triggerBrowserDownload(capturedDataUrl, finalFileName);
        }
      } else {
        triggerBrowserDownload(capturedDataUrl, finalFileName);
        showToast(`✓ تم تنزيل: ${finalFileName}`);
      }

      resetToCamera();
    });

    function triggerBrowserDownload(dataUrl, fileName) {
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    exportZipBtn.addEventListener('click', async () => {
      if (sessionPhotos.length === 0) return;

      exportZipBtn.disabled = true;
      exportZipBtn.textContent = 'جاري الضغط...';

      try {
        const zip = new JSZip();
        const usedNames = {};

        for (const item of sessionPhotos) {
          let fileName = item.name;
          if (usedNames[fileName]) {
            usedNames[fileName]++;
            const base = fileName.replace(/\.jpg$/i, '');
            fileName = `${base}_${usedNames[item.name]}.jpg`;
          } else {
            usedNames[fileName] = 1;
          }
          zip.file(fileName, item.blob);
        }

        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const zipUrl = URL.createObjectURL(zipBlob);
        const dateStr = new Date().toISOString().slice(0, 10);
        triggerBrowserDownload(zipUrl, `photos_${dateStr}.zip`);
        setTimeout(() => URL.revokeObjectURL(zipUrl), 5000);
        showToast('تم تصدير ملف ZIP بنجاح');
      } catch (err) {
        alert('حدث خطأ أثناء إنشاء ملف ZIP.');
      } finally {
        exportZipBtn.disabled = false;
        exportZipBtn.innerHTML = `📦 ZIP (<span id="zipCount">${sessionPhotos.length}</span>)`;
      }
    });

    clearSessionBtn.addEventListener('click', () => {
      if (sessionPhotos.length === 0) return;
      if (confirm('هل تريد مسح سجل الجلسة الحالية من الذاكرة؟ (لن يتم حذف الصور المحفوظة على هاتفك)')) {
        sessionPhotos = [];
        updateHistoryUI();
        closeDrawer();
        showToast('تم تصفير الجلسة');
      }
    });

    function updateHistoryUI() {
      const count = sessionPhotos.length;
      const zipSpan = document.getElementById('zipCount');
      if (zipSpan) zipSpan.textContent = count;
      drawerTotalCount.textContent = count;
      exportZipBtn.disabled = count === 0;

      if (count === 0) {
        historyList.innerHTML = '<span style="color:#64748b;">لا يوجد بعد</span>';
        drawerList.innerHTML = '<p style="color:#64748b; font-size:13px; text-align:center; margin-top:20px;">لم يتم التقاط صور بعد</p>';
        return;
      }

      // تحديث شريط آخر 5 صور (الأحدث أولاً)
      const lastFive = sessionPhotos
        .map((item, idx) => ({ ...item, originalIndex: idx }))
        .slice(-5)
        .reverse();

      historyList.innerHTML = lastFive
        .map(item => `<span class="history-item" onclick="openPhotoViewer(${item.originalIndex})">${item.name}</span>`)
        .join('');

      // تحديث القائمة العمودية الجانبية بجميع الصور
      const allReversed = sessionPhotos
        .map((item, idx) => ({ ...item, originalIndex: idx }))
        .reverse();

      drawerList.innerHTML = allReversed
        .map(item => `
          <div class="drawer-photo-card" onclick="openPhotoViewer(${item.originalIndex})">
            <img class="drawer-thumb" src="${item.dataUrl}" alt="${item.name}">
            <span class="drawer-photo-name">${item.name}</span>
          </div>
        `)
        .join('');
    }

    discardBtn.addEventListener('click', resetToCamera);

    function resetToCamera() {
      capturedBlob = null;
      capturedDataUrl = null;
      renameModal.style.display = 'none';
      previewImg.style.display = 'none';
      video.style.display = 'block';
    }

    startCamera();
  </script>
</body>
</html>
